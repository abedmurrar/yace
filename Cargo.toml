[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
authors = ["Abed Murrar", "YACE contributors"]
license = "MIT OR Apache-2.0"
# repository = "https://github.com/<owner>/yace"   # set once the GitHub repository exists
keywords = ["editor", "terminal", "tui", "multi-root", "ide"]
categories = ["text-editors", "command-line-utilities"]

[workspace.dependencies]
yace-buffer = { path = "crates/yace-buffer" }
yace-workspace = { path = "crates/yace-workspace" }
yace-keymap = { path = "crates/yace-keymap" }
yace-config = { path = "crates/yace-config" }
yace-search = { path = "crates/yace-search" }
yace-terminal = { path = "crates/yace-terminal" }
yace-syntax = { path = "crates/yace-syntax" }
yace-lsp = { path = "crates/yace-lsp" }
yace-plugin-api = { path = "crates/yace-plugin-api" }
yace-git = { path = "crates/yace-git" }
yace-plugin-host = { path = "crates/yace-plugin-host" }
yace-plugin = { path = "crates/yace-plugin" }

ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "underline-color", "layout-cache"] }
crossterm = "0.29"
ropey = "1.6"
unicode-segmentation = "1.13"
unicode-width = "0.2"
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
directories = "6"
crossbeam-channel = "0.5"
notify = { version = "8.2", default-features = false }
globset = "0.4"
clap = { version = "4.6", features = ["derive"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
trash = { version = "5.2", default-features = false }
signal-hook = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tempfile = "3"
smallvec = { version = "1.16", features = ["union", "const_generics"] }
thiserror = "2"
anyhow = "1"
criterion = { version = "0.8", default-features = false }
portable-pty = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies need no debug info in dev/test builds: keeps target/ an
# order of magnitude smaller (it reached 40 GB) and links faster.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.bench]
debug = true
