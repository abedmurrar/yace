name: Pages

# Builds the documentation website (site/, an mdBook) and the signed APT
# repository, and publishes both to GitHub Pages:
#   https://abedmurrar.github.io/yace/       the documentation
#   https://abedmurrar.github.io/yace/apt/   `apt install yace`
# The screenshots in site/src/media/ are committed (regenerate them with
# site/capture/). The APT repository holds the .deb files of the latest
# GitHub Release (built by release.yml, which runs this workflow when it
# publishes), signed with the APT_SIGNING_KEY secret.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CREDITS.md"
      - "THIRD_PARTY_LICENSES.md"
      - "LICENSE-MIT"
      - "LICENSE-APACHE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap's <lastmod> dates come from git.
          fetch-depth: 0
      - name: Cache mdBook ${{ env.MDBOOK_VERSION }}
        id: mdbook
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ env.MDBOOK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        if: steps.mdbook.outputs.cache-hit != 'true'
        run: cargo install mdbook --locked --version "$MDBOOK_VERSION"
      - uses: actions/configure-pages@v5
      - run: mdbook build site
      - name: Search engine tags, sitemap
        run: python3 site/seo.py site/book https://abedmurrar.github.io/yace/
      - name: APT repository (latest release's packages, signed)
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::No APT_SIGNING_KEY secret: publishing the site without the APT repository"
            exit 0
          fi
          mkdir -p debs
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern 'yace_*-*_*.deb' --dir debs; then
            echo "::warning::No release with .deb packages yet: publishing the site without the APT repository"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          scripts/apt_repo.sh debs site/book/apt "$key"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/book

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
