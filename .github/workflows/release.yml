name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # To run the Pages workflow (APT repository) after publishing.
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ "$tag" = "$ver" ] || { echo "tag $tag != Cargo.toml $ver"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): the binaries and .deb packages run on
          # Ubuntu 22.04+ and Debian 12+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p yace
      - name: Third-party licences for this target
        run: python3 scripts/third_party.py ${{ matrix.target }}
      - name: Package
        run: |
          name="yace-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/yace README.md CHANGELOG.md CREDITS.md THIRD_PARTY_LICENSES.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp -r docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Debian package
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          scripts/build_deb.sh dist
          (cd dist && for f in yace_*.deb; do sha256sum "$f" > "$f.sha256"; done)
      - name: Grammar package (C, C++, Go, Java, Ruby, SCSS, SQL, Dockerfile)
        run: |
          python3 scripts/build_grammars.py dist
          (cd dist && for f in yace-grammars-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${{ needs.verify.outputs.version }}" > notes.md
      - name: Checksums
        run: (cd dist && cat *.sha256 > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${{ needs.verify.outputs.version }}" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --title "YACE $GITHUB_REF_NAME" --notes-file notes.md $pre
      - name: Publish the APT repository (Pages)
        if: ${{ !contains(needs.verify.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
