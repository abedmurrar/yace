[package]
name = "yace"
description = "Fast, light, terminal-native multi-root code editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "yace"
path = "src/main.rs"

[lib]
name = "yace_app"
path = "src/lib.rs"

[dependencies]
yace-buffer.workspace = true
yace-workspace.workspace = true
yace-keymap.workspace = true
yace-config.workspace = true
yace-search.workspace = true
yace-terminal.workspace = true
yace-syntax.workspace = true
yace-lsp.workspace = true
yace-plugin-api.workspace = true
yace-git.workspace = true
yace-plugin-host.workspace = true
ratatui.workspace = true
crossbeam-channel.workspace = true
notify.workspace = true
globset.workspace = true
clap.workspace = true
arboard.workspace = true
trash.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
libc = "0.2"

[dev-dependencies]
yace-plugin.workspace = true
tempfile.workspace = true
yace-search.workspace = true
portable-pty.workspace = true
vt100 = "0.15"

[lints]
workspace = true

# `cargo deb -p yace` (cargo-deb): the package for the APT repository.
[package.metadata.deb]
name = "yace"
maintainer = "Abed Murrar <abedjmurrar@gmail.com>"
copyright = "2026, Abed Murrar and YACE contributors"
license-file = ["../../packaging/debian/copyright", "0"]
changelog = "../../target/deb-extra/changelog.Debian"
section = "editors"
priority = "optional"
depends = "$auto"
recommends = "git"
suggests = "xdg-utils"
extended-description = """\
A code editor for the terminal with VS Code's keys and concepts: multi-root \
workspaces (it reads VS Code and Cursor .code-workspace files), an Explorer, \
fuzzy Quick Open, the Command Palette, workspace search and replace, an \
integrated terminal with split panes, language servers, Git, tree-sitter \
highlighting, themes and native plugins. Light: about 9 MiB of memory at \
idle."""
# Generated by scripts/build_deb.sh (compressed docs, Debian changelog).
assets = [
    ["target/release/yace", "usr/bin/", "755"],
    ["../../docs/yace.1", "usr/share/man/man1/yace.1", "644"],
    # Desktop entry (opens YACE in your terminal), icon, AppStream metadata.
    ["../../packaging/linux/io.github.abedmurrar.yace.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.abedmurrar.yace.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/io.github.abedmurrar.yace.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../target/deb-extra/changelog.gz", "usr/share/doc/yace/", "644"],
    ["../../target/deb-extra/README.md.gz", "usr/share/doc/yace/", "644"],
    ["../../target/deb-extra/CREDITS.md.gz", "usr/share/doc/yace/", "644"],
    ["../../target/deb-extra/THIRD_PARTY_LICENSES.md.gz", "usr/share/doc/yace/", "644"],
]
