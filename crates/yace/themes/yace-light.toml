# YACE Light — the default light theme. Syntax colours follow VS Code Light+.
# Every colour key is listed in docs/themes.md.
name = "YACE Light"
type = "light"

[colors]
"editor.background" = "#fbfbfc"
"editor.foreground" = "#24292f"
"descriptionForeground" = "#6e7781"
"sideBar.background" = "#f3f4f6"
"sideBar.foreground" = "#24292f"
"sideBarTitle.foreground" = "#57606a"
"tab.activeBackground" = "#fbfbfc"
"tab.activeForeground" = "#1f2328"
"tab.inactiveBackground" = "#eceef1"
"tab.inactiveForeground" = "#6e7781"
"editorGroupHeader.tabsBackground" = "#eceef1"
"editorGroup.border" = "#d0d7de"
"focusBorder" = "#0969da"
"editor.selectionBackground" = "#add6ff"
"editor.inactiveSelectionBackground" = "#e5ebf1"
"editor.lineHighlightBackground" = "#f1f3f6"
"editorLineNumber.foreground" = "#8c959f"
"editorLineNumber.activeForeground" = "#24292f"
"editorCursor.background" = "#fbfbfc"
"editorCursor.foreground" = "#24292f"
"editorBracketMatch.background" = "#c9e7d7"
"statusBar.background" = "#0969da"
"statusBar.foreground" = "#ffffff"
"statusBar.noFolderBackground" = "#8250df"
"list.activeSelectionBackground" = "#cfe3ff"
"list.activeSelectionForeground" = "#1f2328"
"list.inactiveSelectionBackground" = "#e4e8ec"
"list.highlightForeground" = "#0969da"
"editorWidget.background" = "#f6f8fa"
"editorWidget.foreground" = "#24292f"
"editorWidget.border" = "#0969da"
"quickInputList.focusBackground" = "#cfe3ff"
"input.background" = "#ffffff"
"editorError.foreground" = "#cf222e"
"editorWarning.foreground" = "#9a6700"
"editorInfo.foreground" = "#0969da"
"gitDecoration.modifiedResourceForeground" = "#9a6700"
"gitDecoration.addedResourceForeground" = "#1a7f37"
"gitDecoration.deletedResourceForeground" = "#cf222e"
"yace.dirtyForeground" = "#9a6700"
"yace.missingRootForeground" = "#cf222e"
"scrollbarSlider.background" = "#c4cad1"
"editorWhitespace.foreground" = "#c4cad1"
"editor.findMatchHighlightBackground" = "#fbe3b7"
"editor.findMatchBackground" = "#f2cc60"
"editorSuggestWidget.highlightForeground" = "#0969da"
"terminal.background" = "#f6f8fa"
"terminal.foreground" = "#24292f"
"terminal.ansiBlack" = "#24292f"
"terminal.ansiRed" = "#cf222e"
"terminal.ansiGreen" = "#116329"
"terminal.ansiYellow" = "#4d2d00"
"terminal.ansiBlue" = "#0969da"
"terminal.ansiMagenta" = "#8250df"
"terminal.ansiCyan" = "#1b7c83"
"terminal.ansiWhite" = "#6e7781"
"terminal.ansiBrightBlack" = "#57606a"
"terminal.ansiBrightRed" = "#a40e26"
"terminal.ansiBrightGreen" = "#1a7f37"
"terminal.ansiBrightYellow" = "#633c01"
"terminal.ansiBrightBlue" = "#218bff"
"terminal.ansiBrightMagenta" = "#a475f9"
"terminal.ansiBrightCyan" = "#3192aa"
"terminal.ansiBrightWhite" = "#8c959f"

[syntax]
"none" = "#24292f"
"comment" = "#008000"
"string" = "#a31515"
"string.special" = "#811f3f"
"string.escape" = "#ee0000"
"character" = "#a31515"
"number" = "#098658"
"boolean" = "#0000ff"
"constant" = "#0070c1"
"constant.builtin" = "#0000ff"
"keyword" = "#0000ff"
"keyword.control" = "#af00db"
"operator" = "#24292f"
"punctuation" = "#24292f"
"punctuation.bracket" = "#24292f"
"function" = "#795e26"
"function.builtin" = "#795e26"
"function.method" = "#795e26"
"function.macro" = "#267f99"
"type" = "#267f99"
"type.builtin" = "#267f99"
"constructor" = "#267f99"
"variable" = "#001080"
"variable.builtin" = "#0000ff"
"variable.parameter" = "#001080"
"property" = "#001080"
"attribute" = "#e50000"
"tag" = "#800000"
"namespace" = "#267f99"
"label" = "#24292f"
"markup.heading" = { fg = "#800000", bold = true }
"markup.bold" = { fg = "#24292f", bold = true }
"markup.italic" = { fg = "#24292f", italic = true }
"markup.link" = { fg = "#0451a5", underline = true }
"markup.raw" = "#a31515"
"markup.list" = "#0451a5"
"embedded" = "#24292f"
