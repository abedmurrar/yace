name = "Tokyo Night"
type = "dark"

[colors]
"editor.background" = "#1a1b26"
"editor.foreground" = "#a9b1d6"
"descriptionForeground" = "#565f89"
"sideBar.background" = "#16161e"
"sideBar.foreground" = "#787c99"
"sideBarTitle.foreground" = "#a9b1d6"
"tab.activeBackground" = "#1a1b26"
"tab.activeForeground" = "#a9b1d6"
"tab.inactiveBackground" = "#16161e"
"tab.inactiveForeground" = "#787c99"
"editorGroupHeader.tabsBackground" = "#16161e"
"editorGroup.border" = "#101014"
"focusBorder" = "#7aa2f7"
"editor.selectionBackground" = "#515c7e4d"
"editor.inactiveSelectionBackground" = "#515c7e25"
"editor.lineHighlightBackground" = "#1e202e"
"editorLineNumber.foreground" = "#363b54"
"editorLineNumber.activeForeground" = "#737aa2"
"editorCursor.background" = "#1a1b26"
"editorCursor.foreground" = "#c0caf5"
"editorBracketMatch.background" = "#343a52"
"statusBar.background" = "#16161e"
"statusBar.foreground" = "#787c99"
"statusBar.noFolderBackground" = "#2b2240"
"list.activeSelectionBackground" = "#2a3047"
"list.activeSelectionForeground" = "#a9b1d6"
"list.inactiveSelectionBackground" = "#1c1d29"
"list.highlightForeground" = "#668ac4"
"editorWidget.background" = "#16161e"
"editorWidget.foreground" = "#a9b1d6"
"editorWidget.border" = "#3d59a1"
"quickInputList.focusBackground" = "#2a3047"
"input.background" = "#14141b"
"editorError.foreground" = "#db4b4b"
"editorWarning.foreground" = "#e0af68"
"editorInfo.foreground" = "#0da0ba"
"gitDecoration.modifiedResourceForeground" = "#6183bb"
"gitDecoration.addedResourceForeground" = "#449dab"
"gitDecoration.deletedResourceForeground" = "#914c54"
"yace.dirtyForeground" = "#e0af68"
"yace.missingRootForeground" = "#db4b4b"
"scrollbarSlider.background" = "#2f3549"
"editorWhitespace.foreground" = "#363b54"
"editor.findMatchHighlightBackground" = "#3d59a166"
"editor.findMatchBackground" = "#515c7e"
"editorSuggestWidget.highlightForeground" = "#6183bb"
"terminal.background" = "#16161e"
"terminal.foreground" = "#a9b1d6"
"terminal.ansiBlack" = "#363b54"
"terminal.ansiRed" = "#f7768e"
"terminal.ansiGreen" = "#73daca"
"terminal.ansiYellow" = "#e0af68"
"terminal.ansiBlue" = "#7aa2f7"
"terminal.ansiMagenta" = "#bb9af7"
"terminal.ansiCyan" = "#7dcfff"
"terminal.ansiWhite" = "#787c99"
"terminal.ansiBrightBlack" = "#363b54"
"terminal.ansiBrightRed" = "#f7768e"
"terminal.ansiBrightGreen" = "#73daca"
"terminal.ansiBrightYellow" = "#e0af68"
"terminal.ansiBrightBlue" = "#7aa2f7"
"terminal.ansiBrightMagenta" = "#bb9af7"
"terminal.ansiBrightCyan" = "#7dcfff"
"terminal.ansiBrightWhite" = "#acb0d0"

[syntax]
"none" = "#a9b1d6"
"comment" = { fg = "#51597d", italic = true }
"string" = "#9ece6a"
"string.special" = "#b4f9f8"
"string.escape" = "#89ddff"
"character" = "#9ece6a"
"number" = "#ff9e64"
"boolean" = "#ff9e64"
"constant" = "#ff9e64"
"constant.builtin" = "#ff9e64"
"keyword" = "#bb9af7"
"keyword.control" = "#bb9af7"
"operator" = "#89ddff"
"punctuation" = "#89ddff"
"punctuation.bracket" = "#698cd6"
"function" = "#7aa2f7"
"function.builtin" = "#2ac3de"
"function.method" = "#7aa2f7"
"function.macro" = "#7dcfff"
"type" = "#2ac3de"
"type.builtin" = "#0db9d7"
"constructor" = "#2ac3de"
"variable" = "#c0caf5"
"variable.builtin" = "#f7768e"
"variable.parameter" = "#e0af68"
"property" = "#73daca"
"attribute" = { fg = "#bb9af7", italic = true }
"tag" = "#f7768e"
"namespace" = "#0db9d7"
"label" = "#7aa2f7"
"markup.heading" = { fg = "#89ddff", bold = true }
"markup.bold" = { fg = "#c0caf5", bold = true }
"markup.italic" = { fg = "#c0caf5", italic = true }
"markup.link" = { fg = "#73daca", underline = true }
"markup.raw" = "#89ddff"
"markup.list" = "#ff9e64"
"embedded" = "#c0caf5"
