# YACE Dark — the default theme. Syntax colours follow VS Code Dark+ so
# VS Code users feel at home. Every colour key is listed in docs/themes.md.
name = "YACE Dark"
type = "dark"

[colors]
"editor.background" = "#1e1f24"
"editor.foreground" = "#d4d6dc"
"descriptionForeground" = "#808692"
"sideBar.background" = "#191a1f"
"sideBar.foreground" = "#c4c7cf"
"sideBarTitle.foreground" = "#9aa0ac"
"tab.activeBackground" = "#1e1f24"
"tab.activeForeground" = "#f2f3f5"
"tab.inactiveBackground" = "#25262c"
"tab.inactiveForeground" = "#8c919c"
"editorGroupHeader.tabsBackground" = "#25262c"
"editorGroup.border" = "#34363e"
"focusBorder" = "#4d8df5"
"editor.selectionBackground" = "#264f78"
"editor.inactiveSelectionBackground" = "#3a3d41"
"editor.lineHighlightBackground" = "#26282e"
"editorLineNumber.foreground" = "#5a5f6b"
"editorLineNumber.activeForeground" = "#c6c9d1"
"editorCursor.background" = "#1e1f24"
"editorCursor.foreground" = "#aeafad"
"editorBracketMatch.background" = "#3b514d"
"statusBar.background" = "#1f4f8f"
"statusBar.foreground" = "#f2f3f5"
"statusBar.noFolderBackground" = "#6c3c8c"
"list.activeSelectionBackground" = "#04395e"
"list.activeSelectionForeground" = "#f2f3f5"
"list.inactiveSelectionBackground" = "#37373d"
"list.highlightForeground" = "#3da9fc"
"editorWidget.background" = "#25262c"
"editorWidget.foreground" = "#d4d6dc"
"editorWidget.border" = "#4d8df5"
"quickInputList.focusBackground" = "#04395e"
"input.background" = "#31333b"
"editorError.foreground" = "#f14c4c"
"editorWarning.foreground" = "#cca700"
"editorInfo.foreground" = "#3da9fc"
"gitDecoration.modifiedResourceForeground" = "#e2c08d"
"gitDecoration.addedResourceForeground" = "#81b88b"
"gitDecoration.deletedResourceForeground" = "#c74e39"
"yace.dirtyForeground" = "#e2c08d"
"yace.missingRootForeground" = "#c74e39"
"scrollbarSlider.background" = "#42454f"
"editorWhitespace.foreground" = "#454852"
"editor.findMatchHighlightBackground" = "#623315"
"editor.findMatchBackground" = "#9e6a03"
"editorSuggestWidget.highlightForeground" = "#3da9fc"
"terminal.background" = "#1a1b20"
"terminal.foreground" = "#d4d6dc"
"terminal.ansiBlack" = "#1e1f24"
"terminal.ansiRed" = "#e06c75"
"terminal.ansiGreen" = "#98c379"
"terminal.ansiYellow" = "#e5c07b"
"terminal.ansiBlue" = "#61afef"
"terminal.ansiMagenta" = "#c678dd"
"terminal.ansiCyan" = "#56b6c2"
"terminal.ansiWhite" = "#d4d6dc"
"terminal.ansiBrightBlack" = "#5c6370"
"terminal.ansiBrightRed" = "#f07c85"
"terminal.ansiBrightGreen" = "#a8d389"
"terminal.ansiBrightYellow" = "#f5d08b"
"terminal.ansiBrightBlue" = "#71bfff"
"terminal.ansiBrightMagenta" = "#d688ed"
"terminal.ansiBrightCyan" = "#66c6d2"
"terminal.ansiBrightWhite" = "#ffffff"

# Keys are tree-sitter capture names (docs/themes.md). A value is a colour
# or a table: { fg = "#…", bold = true, italic = true, underline = true }.
[syntax]
"none" = "#d4d6dc"
"comment" = "#6a9955"
"string" = "#ce9178"
"string.special" = "#d16969"
"string.escape" = "#d7ba7d"
"character" = "#ce9178"
"number" = "#b5cea8"
"boolean" = "#569cd6"
"constant" = "#4fc1ff"
"constant.builtin" = "#569cd6"
"keyword" = "#569cd6"
"keyword.control" = "#c586c0"
"operator" = "#d4d6dc"
"punctuation" = "#d4d6dc"
"punctuation.bracket" = "#d4d6dc"
"function" = "#dcdcaa"
"function.builtin" = "#dcdcaa"
"function.method" = "#dcdcaa"
"function.macro" = "#4ec9b0"
"type" = "#4ec9b0"
"type.builtin" = "#4ec9b0"
"constructor" = "#4ec9b0"
"variable" = "#9cdcfe"
"variable.builtin" = "#569cd6"
"variable.parameter" = "#9cdcfe"
"property" = "#9cdcfe"
"attribute" = "#9cdcfe"
"tag" = "#569cd6"
"namespace" = "#4ec9b0"
"label" = "#c8c8c8"
"markup.heading" = { fg = "#569cd6", bold = true }
"markup.bold" = { fg = "#d4d6dc", bold = true }
"markup.italic" = { fg = "#d4d6dc", italic = true }
"markup.link" = { fg = "#4daafc", underline = true }
"markup.raw" = "#ce9178"
"markup.list" = "#6796e6"
"embedded" = "#d4d6dc"
