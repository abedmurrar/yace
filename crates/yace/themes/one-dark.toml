# One Dark — palette from Atom's One Dark (MIT, Copyright (c) 2014 GitHub Inc.),
# as popularised by the One Dark Pro VS Code theme (MIT, Binaryify). See CREDITS.md.
name = "One Dark"
type = "dark"

[colors]
"editor.background" = "#282c34"
"editor.foreground" = "#abb2bf"
"descriptionForeground" = "#5c6370"
"sideBar.background" = "#21252b"
"sideBar.foreground" = "#abb2bf"
"sideBarTitle.foreground" = "#9da5b4"
"tab.activeBackground" = "#282c34"
"tab.activeForeground" = "#d7dae0"
"tab.inactiveBackground" = "#21252b"
"tab.inactiveForeground" = "#9da5b4"
"editorGroupHeader.tabsBackground" = "#21252b"
"editorGroup.border" = "#181a1f"
"focusBorder" = "#528bff"
"editor.selectionBackground" = "#3e4451"
"editor.inactiveSelectionBackground" = "#3a3f4b"
"editor.lineHighlightBackground" = "#2c313c"
"editorLineNumber.foreground" = "#495162"
"editorLineNumber.activeForeground" = "#abb2bf"
"editorCursor.background" = "#282c34"
"editorCursor.foreground" = "#528bff"
"editorBracketMatch.background" = "#515a6b"
"statusBar.background" = "#21252b"
"statusBar.foreground" = "#9da5b4"
"statusBar.noFolderBackground" = "#3e3354"
"list.activeSelectionBackground" = "#2c313a"
"list.activeSelectionForeground" = "#d7dae0"
"list.inactiveSelectionBackground" = "#323842"
"list.highlightForeground" = "#61afef"
"editorWidget.background" = "#21252b"
"editorWidget.foreground" = "#abb2bf"
"editorWidget.border" = "#528bff"
"quickInputList.focusBackground" = "#2c313a"
"input.background" = "#1d1f23"
"editorError.foreground" = "#e06c75"
"editorWarning.foreground" = "#e5c07b"
"editorInfo.foreground" = "#61afef"
"gitDecoration.modifiedResourceForeground" = "#e5c07b"
"gitDecoration.addedResourceForeground" = "#98c379"
"gitDecoration.deletedResourceForeground" = "#e06c75"
"yace.dirtyForeground" = "#e5c07b"
"yace.missingRootForeground" = "#e06c75"
"scrollbarSlider.background" = "#4e5666"
"editorWhitespace.foreground" = "#3b4048"
"editor.findMatchHighlightBackground" = "#314365"
"editor.findMatchBackground" = "#42557b"
"editorSuggestWidget.highlightForeground" = "#61afef"
"terminal.background" = "#282c34"
"terminal.foreground" = "#abb2bf"
"terminal.ansiBlack" = "#3f4451"
"terminal.ansiRed" = "#e05561"
"terminal.ansiGreen" = "#8cc265"
"terminal.ansiYellow" = "#d18f52"
"terminal.ansiBlue" = "#4aa5f0"
"terminal.ansiMagenta" = "#c162de"
"terminal.ansiCyan" = "#42b3c2"
"terminal.ansiWhite" = "#d7dae0"
"terminal.ansiBrightBlack" = "#4f5666"
"terminal.ansiBrightRed" = "#ff616e"
"terminal.ansiBrightGreen" = "#a5e075"
"terminal.ansiBrightYellow" = "#f0a45d"
"terminal.ansiBrightBlue" = "#4dc4ff"
"terminal.ansiBrightMagenta" = "#de73ff"
"terminal.ansiBrightCyan" = "#4cd1e0"
"terminal.ansiBrightWhite" = "#e6e6e6"

[syntax]
"none" = "#abb2bf"
"comment" = { fg = "#7f848e", italic = true }
"string" = "#98c379"
"string.special" = "#56b6c2"
"string.escape" = "#56b6c2"
"character" = "#98c379"
"number" = "#d19a66"
"boolean" = "#d19a66"
"constant" = "#d19a66"
"constant.builtin" = "#d19a66"
"keyword" = "#c678dd"
"keyword.control" = "#c678dd"
"operator" = "#56b6c2"
"punctuation" = "#abb2bf"
"punctuation.bracket" = "#abb2bf"
"function" = "#61afef"
"function.builtin" = "#56b6c2"
"function.method" = "#61afef"
"function.macro" = "#61afef"
"type" = "#e5c07b"
"type.builtin" = "#e5c07b"
"constructor" = "#e5c07b"
"variable" = "#e06c75"
"variable.builtin" = "#e5c07b"
"variable.parameter" = "#d19a66"
"property" = "#e06c75"
"attribute" = "#d19a66"
"tag" = "#e06c75"
"namespace" = "#e5c07b"
"label" = "#e06c75"
"markup.heading" = { fg = "#e06c75", bold = true }
"markup.bold" = { fg = "#d19a66", bold = true }
"markup.italic" = { fg = "#c678dd", italic = true }
"markup.link" = { fg = "#56b6c2", underline = true }
"markup.raw" = "#98c379"
"markup.list" = "#e06c75"
"embedded" = "#abb2bf"
