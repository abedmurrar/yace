[syntax]
"none" = "#f8f8f2"
"comment" = "#6272a4"
"string" = "#f1fa8c"
"string.special" = "#ff5555"
"string.escape" = "#ff79c6"
"character" = "#f1fa8c"
"number" = "#bd93f9"
"boolean" = "#bd93f9"
"constant" = "#bd93f9"
"constant.builtin" = "#bd93f9"
"keyword" = "#ff79c6"
"keyword.control" = "#ff79c6"
"operator" = "#ff79c6"
"punctuation" = "#f8f8f2"
"punctuation.bracket" = "#f8f8f2"
"function" = "#50fa7b"
"function.builtin" = "#8be9fd"
"function.method" = "#50fa7b"
"function.macro" = "#50fa7b"
"type" = { fg = "#8be9fd", italic = true }
"type.builtin" = { fg = "#8be9fd", italic = true }
"constructor" = "#8be9fd"
"variable" = "#f8f8f2"
"variable.builtin" = { fg = "#bd93f9", italic = true }
"variable.parameter" = { fg = "#ffb86c", italic = true }
"property" = "#f8f8f2"
"attribute" = { fg = "#50fa7b", italic = true }
"tag" = "#ff79c6"
"namespace" = "#8be9fd"
"label" = "#8be9fd"
"markup.heading" = { fg = "#bd93f9", bold = true }
"markup.bold" = { fg = "#ffb86c", bold = true }
"markup.italic" = { fg = "#f1fa8c", italic = true }
"markup.link" = { fg = "#8be9fd", underline = true }
"markup.raw" = "#50fa7b"
"markup.list" = "#8be9fd"
"embedded" = "#f8f8f2"
