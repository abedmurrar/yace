"constructor" = "#74c7ec"
"variable" = "#cdd6f4"
"variable.builtin" = "#f38ba8"
"variable.parameter" = { fg = "#eba0ac", italic = true }
"property" = "#b4befe"
"attribute" = "#f9e2af"
"tag" = "#cba6f7"
"namespace" = { fg = "#f9e2af", italic = true }
"label" = "#74c7ec"
