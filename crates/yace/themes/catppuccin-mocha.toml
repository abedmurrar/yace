[syntax]
"none" = "#cdd6f4"
"comment" = { fg = "#9399b2", italic = true }
"string" = "#a6e3a1"
"string.special" = "#f5c2e7"
"string.escape" = "#f5c2e7"
"character" = "#94e2d5"
"number" = "#fab387"
"boolean" = "#fab387"
"constant" = "#fab387"
"constant.builtin" = "#fab387"
"keyword" = "#cba6f7"
"keyword.control" = "#cba6f7"
"operator" = "#89dceb"
"punctuation" = "#9399b2"
"punctuation.bracket" = "#9399b2"
"function" = "#89b4fa"
"function.builtin" = "#fab387"
"function.method" = "#89b4fa"
"function.macro" = "#cba6f7"
"type" = "#f9e2af"
