[package]
name = "yace-syntax"
description = "YACE syntax: language registry and detection, incremental tree-sitter parsing, viewport highlighting, folding ranges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-scss = { version = "1", optional = true }
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-bash = "0.25"
tree-sitter-ini = "1.4"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-containerfile = { version = "0.9", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
globset.workspace = true

[features]
# Compile every grammar into the binary. Release builds leave these out:
# C, C++, Go, Java, Ruby, SCSS, SQL and Dockerfile ship as the installable
# `yace-grammars` package (scripts/build_grammars.py), loaded on first use.
all-grammars = [
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-scss",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-containerfile",
]

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "syntax"
harness = false
