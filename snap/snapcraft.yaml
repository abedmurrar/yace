# The YACE snap (`snapcraft pack`; published by .github/workflows/snap.yml).
# Classic confinement: an editor opens any file and runs your shell, git
# and language servers, which strict confinement would block.
name: yace
title: YACE
summary: Fast, light, terminal-native multi-root code editor
description: |
  YACE is a code editor for the terminal with VS Code's keys and concepts.
  It opens multi-root workspaces (including VS Code and Cursor
  .code-workspace files) and stays light: about 9 MiB of memory at idle.

  - Explorer, fuzzy Quick Open and the Command Palette
  - Workspace search and replace with a before/after preview
  - Integrated terminal with split panes and scrollback search
  - Language servers: completion, hover, go to definition, rename
  - Git: status, gutter changes, diffs, commit and branches
  - Tree-sitter highlighting, folding, themes and native plugins

  Documentation: https://abedmurrar.github.io/yace/
adopt-info: yace
base: core22
grade: stable
confinement: classic
license: MIT OR Apache-2.0
icon: packaging/linux/io.github.abedmurrar.yace.svg
website: https://abedmurrar.github.io/yace/
source-code: https://github.com/abedmurrar/yace
issues: https://github.com/abedmurrar/yace/issues

apps:
  yace:
    command: bin/yace
    common-id: io.github.abedmurrar.yace
    desktop: share/applications/io.github.abedmurrar.yace.desktop

parts:
  yace:
    plugin: rust
    source: .
    rust-channel: stable
    rust-path: [crates/yace]
    build-packages: [gcc, g++, pkg-config]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
    override-build: |
      craftctl default
      install -Dm644 packaging/linux/io.github.abedmurrar.yace.svg \
        "$CRAFT_PART_INSTALL/share/icons/hicolor/scalable/apps/io.github.abedmurrar.yace.svg"
      install -Dm644 packaging/linux/io.github.abedmurrar.yace.metainfo.xml \
        "$CRAFT_PART_INSTALL/share/metainfo/io.github.abedmurrar.yace.metainfo.xml"
      # Inside a snap the icon is referenced by its path in the snap.
      sed 's|^Icon=.*|Icon=${SNAP}/share/icons/hicolor/scalable/apps/io.github.abedmurrar.yace.svg|' \
        packaging/linux/io.github.abedmurrar.yace.desktop > yace.desktop
      install -Dm644 yace.desktop "$CRAFT_PART_INSTALL/share/applications/io.github.abedmurrar.yace.desktop"
      install -Dm644 docs/yace.1 "$CRAFT_PART_INSTALL/share/man/man1/yace.1"
